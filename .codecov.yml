codecov:
  require_ci_to_pass: false

ignore:
  - "**/zz_generated*.go"  # generated deepcopy code
  - "config/**"            # CRD, RBAC, and kustomize manifests
  - "vendor/**"            # vendored dependencies
  - "e2e-tests/**"         # e2e test code
  - "pkg/logs/constants.go"         # logging code
  - "pkg/quay/quay_client_mock.go"  # mock for quay client

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 85%

comment: false
