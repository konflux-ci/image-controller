codecov:
  require_ci_to_pass: false
ignore:
- '**/zz_generated*.go'
- config/**
- vendor/**
- .agents/**
- .claude/**
- .cursor/**
- skills/**
- docs/**
- '*.md'
- '*.toml'
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 85%
comment: false
