apiVersion: batch/v1
kind: CronJob
metadata:
  name: notification-resetter-cronjob
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: notification-resetter
            image: registry.redhat.io/rhel9/python-312:9.5-1739797362
            env:
              - name: QUAY_ORG
                valueFrom:
                  secretKeyRef:
                    name: quaytoken
                    key: organization
            imagePullPolicy: IfNotPresent
            command:
              - /bin/bash
              - '-c'
              - python /notification-resetter/reset_notifications.py --namespace $(QUAY_ORG)
            volumeMounts:
              - name: notification-resetter-volume
                mountPath: /notification-resetter
              - name: quaytoken
                mountPath: /secrets/quaytoken
                readOnly: true
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 150m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
              readOnlyRootFilesystem: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: notification-resetter-volume
              configMap:
                name: notification-resetter-configmap
            - name: quaytoken
              secret:
                secretName: quaytoken
