apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-pruner-cronjob
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: image-pruner
            # https://catalog.redhat.com/en/software/containers/ubi9/python-314/690b0a9fcfc8d02bfb0d341e
            image: registry.access.redhat.com/ubi9/python-314:9.8-1787079087@sha256:194df4e35e0e5467e1b57266f4d61f821e1b1f567135f074d23066d3604ae653
            env:
              - name: QUAY_ORG
                valueFrom:
                  secretKeyRef:
                    name: image-pruner-token
                    key: organization
            imagePullPolicy: IfNotPresent
            command:
              - /bin/bash
              - '-c'
              - python /image-pruner/prune_images.py --namespace $(QUAY_ORG)
            volumeMounts:
              - name: image-pruner-volume
                mountPath: /image-pruner
              - name: image-pruner-token
                mountPath: /secrets/image-pruner
                readOnly: true
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 150m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
              readOnlyRootFilesystem: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: image-pruner-volume
              configMap:
                name: image-pruner-configmap
            - name: image-pruner-token
              secret:
                secretName: image-pruner-token
